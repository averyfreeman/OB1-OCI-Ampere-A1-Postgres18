name: OB1 PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  event_guard:
    name: OB1 Gate Event Guard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Explain non-review gate run
        run: |
          echo "OB1 PR Gate received a ${GITHUB_EVENT_NAME} event."
          echo "The production review runs for pull_request events."

  review:
    name: OB1 Production Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head safely
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            integrations/oci-node/package-lock.json
            dashboards/open-brain-dashboard-next/package-lock.json

      - name: Get changed files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA...HEAD")"
          {
            echo "files<<EOF"
            echo "$changed"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Test gate helpers
        run: |
          node --test .github/scripts/gate-context.test.cjs
          python3 -B .github/scripts/test_gate_artifact.py

      - name: Validate active deployment paths
        run: |
          set -euo pipefail
          test -f integrations/oci-node/systemd/ob1-api.service
          test -f integrations/oci-node/systemd/ob1-dashboard.service
          test -f dashboards/open-brain-dashboard-next/package.json
          test -f dashboards/ob1-canonical-landing/index.html
          test -f dashboards/ob1-canonical-landing/CNAME
          grep -q 'dashboards/ob1-canonical-landing/' .github/workflows/deploy-pages.yml
          grep -q 'dashboards/open-brain-dashboard-next' integrations/oci-node/systemd/ob1-dashboard.service

      - name: Reject tracked backup content
        run: |
          set -euo pipefail
          tracked_backup="$(git ls-files BACKUP_RESOURCES | grep -v '^BACKUP_RESOURCES/\.gitignore$' || true)"
          test -z "$tracked_backup"

      - name: Scan changed text for obvious secrets
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -euo pipefail
          blocked=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ -f "$file" ] || continue
            case "$file" in
              *.md|*.json|*.jsonc|*.js|*.mjs|*.ts|*.tsx|*.yml|*.yaml|*.env.example) ;;
              *) continue ;;
            esac
            if grep -nE -- '-----BEGIN [A-Z ]+ PRIVATE KEY-----|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}' "$file"; then
              blocked=true
            fi
          done <<< "$CHANGED_FILES"
          if [ "$blocked" = true ]; then
            echo "Obvious credential material found in changed text."
            exit 1
          fi

      - name: Verify OCI runtime
        if: contains(steps.changed.outputs.files, 'integrations/oci-node/')
        working-directory: integrations/oci-node
        run: |
          npm ci
          npm test
          npm run build

      - name: Verify dashboard
        if: contains(steps.changed.outputs.files, 'dashboards/open-brain-dashboard-next/')
        working-directory: dashboards/open-brain-dashboard-next
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Verify Pages asset
        if: contains(steps.changed.outputs.files, 'dashboards/ob1-canonical-landing/')
        run: |
          test -s dashboards/ob1-canonical-landing/index.html
          test -s dashboards/ob1-canonical-landing/CNAME
          test -s dashboards/ob1-canonical-landing/sitemap.xml

name: Auto-Label PRs

on:
  pull_request_target:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Detect production surface and apply labels
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const labels = new Set();
            const pathMap = {
              "integrations/oci-node/": "runtime",
              "dashboards/": "dashboard",
              "docs/": "documentation",
              ".github/": "ci",
              ".claude/": "maintenance",
            };

            for (const file of files) {
              for (const [prefix, label] of Object.entries(pathMap)) {
                if (file.filename.startsWith(prefix)) labels.add(label);
              }
              if (file.filename.endsWith(".md") && !file.filename.includes("/")) {
                labels.add("documentation");
              }
            }

            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [...labels],
              });
              console.log("Applied labels:", [...labels].join(", "));
            } else {
              console.log("No active production surface detected.");
            }
